name: Qualify legacy Repo Cassette transport

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - uses: ./legacy-qualify
        env:
          GITHUB_TOKEN: ${{ github.token }}
