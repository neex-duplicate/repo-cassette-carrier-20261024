name: Cross-job artifact metadata race




on:
  workflow_dispatch:




permissions:
  actions: write
  contents: read




jobs:
  cross-race:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        index: [0, 1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - uses: ./cross-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MATRIX_INDEX: ${{ matrix.index }}
          MATRIX_TOTAL: '2'



